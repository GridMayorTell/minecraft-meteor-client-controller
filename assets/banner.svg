<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="55%" stop-color="#141a2b"/>
      <stop offset="100%" stop-color="#1d1233"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a970ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7b3fe4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7b3fe4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="45%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c026d3" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a3f"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <circle cx="900" cy="120" r="260" fill="url(#glow)"/>

  <!-- faint block grid backdrop -->
  <g stroke="#3a3560" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- meteor trail streak -->
  <polygon points="1180,10 980,10 700,260 780,300" fill="url(#trail)"/>

  <!-- meteor core (blocky voxel meteor) -->
  <g transform="translate(940,90) rotate(20)">
    <rect x="-45" y="-45" width="90" height="90" fill="url(#meteor)" stroke="#5b1a8a" stroke-width="4"/>
    <rect x="-45" y="-45" width="30" height="30" fill="#ffdca0" opacity="0.7"/>
    <rect x="15" y="15" width="30" height="30" fill="#7c1fa0" opacity="0.6"/>
    <rect x="-15" y="15" width="20" height="20" fill="#ffb347" opacity="0.55"/>
  </g>

  <!-- floating debris blocks -->
  <g opacity="0.9">
    <rect x="1030" y="60" width="22" height="22" fill="#a855f7"/>
    <rect x="1075" y="150" width="16" height="16" fill="#38bdf8"/>
    <rect x="1015" y="190" width="14" height="14" fill="#f97316"/>
    <rect x="1095" y="90" width="18" height="18" fill="#5fa73c"/>
    <rect x="960" y="200" width="12" height="12" fill="#ffdca0"/>
  </g>

  <!-- blocky mountain / terrain silhouette at bottom -->
  <g fill="url(#ground)">
    <rect x="0" y="300" width="90" height="60"/>
    <rect x="90" y="280" width="60" height="80"/>
    <rect x="150" y="310" width="70" height="50"/>
    <rect x="220" y="290" width="50" height="70"/>
    <rect x="270" y="320" width="80" height="40"/>
    <rect x="350" y="300" width="60" height="60"/>
    <rect x="410" y="330" width="790" height="30"/>
  </g>

  <!-- little grass-block accents on terrain edge -->
  <g>
    <rect x="90" y="270" width="60" height="12" fill="#5fa73c"/>
    <rect x="220" y="280" width="50" height="12" fill="#5fa73c"/>
    <rect x="0" y="290" width="90" height="12" fill="#5fa73c"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#f5f2ff" textLength="880" lengthAdjust="spacingAndGlyphs">
    Minecraft Meteor Client
  </text>

  <!-- accent underline -->
  <rect x="62" y="168" width="360" height="6" fill="#a855f7" opacity="0.85"/>
  <rect x="426" y="168" width="120" height="6" fill="#38bdf8" opacity="0.7"/>

  <!-- tagline -->
  <text x="60" y="215" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#c9c2e8" textLength="1000" lengthAdjust="spacingAndGlyphs">
    Runs a lightweight Windows launcher for the Meteor Client Minecraft utility mod
  </text>

  <!-- small pixel divider decoration under tagline -->
  <g opacity="0.8">
    <rect x="60" y="250" width="10" height="10" fill="#a855f7"/>
    <rect x="76" y="250" width="10" height="10" fill="#38bdf8"/>
    <rect x="92" y="250" width="10" height="10" fill="#5fa73c"/>
    <rect x="108" y="250" width="10" height="10" fill="#f97316"/>
  </g>
</svg>